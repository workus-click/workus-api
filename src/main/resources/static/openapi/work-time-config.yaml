paths:
  /api/attend/work-time-config:
    get:
      tags:
        - 근무시간 설정
      summary: '근무시간 설정 목록 조회'
      description: '매장의 근무시간 설정 목록을 조회합니다.'
      parameters:
        - in: query
          name: storeId
          required: true
          schema:
            type: integer
            format: int64
          description: 매장 ID
          example: 1
      responses:
        '200':
          description: '조회 성공'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './work-time-config-schemas.yaml#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: './work-time-config-schemas.yaml#/components/schemas/WorkTimeConfigResponse'
              examples:
                success:
                  value:
                    code: 0
                    message: 성공
                    data:
                      - id: 1
                        storeId: 1
                        workerType: PART_TIME
                        title: "오전 파트"
                        workStartTime: "09:00:00"
                        workEndTime: "14:00:00"
                        breakStartTime: null
                        breakEndTime: null
                      - id: 2
                        storeId: 1
                        workerType: FULL_TIME
                        title: "정직원"
                        workStartTime: "09:00:00"
                        workEndTime: "18:00:00"
                        breakStartTime: "12:00:00"
                        breakEndTime: "13:00:00"

    post:
      tags:
        - 근무시간 설정
      summary: '근무시간 설정 생성'
      description: '새로운 근무시간 설정을 생성합니다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './work-time-config-schemas.yaml#/components/schemas/CreateWorkTimeConfigRequest'
            examples:
              partTime:
                summary: 파트타임 근무
                value:
                  storeId: 1
                  workerType: PART_TIME
                  title: "오전 파트"
                  workStartTime: "09:00:00"
                  workEndTime: "14:00:00"
                  breakStartTime: null
                  breakEndTime: null
              fullTime:
                summary: 정직원 근무
                value:
                  storeId: 1
                  workerType: FULL_TIME
                  title: "정직원"
                  workStartTime: "09:00:00"
                  workEndTime: "18:00:00"
                  breakStartTime: "12:00:00"
                  breakEndTime: "13:00:00"
      responses:
        '200':
          description: '생성 성공'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './work-time-config-schemas.yaml#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: './work-time-config-schemas.yaml#/components/schemas/WorkTimeConfigResponse'
              examples:
                success:
                  value:
                    code: 0
                    message: 성공
                    data:
                      id: 3
                      storeId: 1
                      workerType: PART_TIME
                      title: "오전 파트"
                      workStartTime: "09:00:00"
                      workEndTime: "14:00:00"
                      breakStartTime: null
                      breakEndTime: null
        '400':
          description: '파라미터 오류'
          content:
            application/json:
              schema:
                $ref: './work-time-config-schemas.yaml#/components/schemas/Response'
              examples:
                validationError:
                  value:
                    code: -1
                    message: 요청값 오류
                    data:
                      title: "must not be blank"

  /api/attend/work-time-config/{id}:
    get:
      tags:
        - 근무시간 설정
      summary: '근무시간 설정 단건 조회'
      description: '근무시간 설정을 ID로 조회합니다.'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 근무시간 설정 ID
          example: 1
      responses:
        '200':
          description: '조회 성공'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './work-time-config-schemas.yaml#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: './work-time-config-schemas.yaml#/components/schemas/WorkTimeConfigResponse'
              examples:
                success:
                  value:
                    code: 0
                    message: 성공
                    data:
                      id: 1
                      storeId: 1
                      workerType: PART_TIME
                      title: "오전 파트"
                      workStartTime: "09:00:00"
                      workEndTime: "14:00:00"
                      breakStartTime: null
                      breakEndTime: null
                notFound:
                  value:
                    code: -1
                    message: "근무시간 설정을 찾을 수 없습니다."
                    data: null

    put:
      tags:
        - 근무시간 설정
      summary: '근무시간 설정 수정'
      description: '근무시간 설정을 수정합니다.'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 근무시간 설정 ID
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './work-time-config-schemas.yaml#/components/schemas/UpdateWorkTimeConfigRequest'
            example:
              title: "오전 파트 (수정)"
              workStartTime: "08:30:00"
              workEndTime: "14:30:00"
              breakStartTime: null
              breakEndTime: null
      responses:
        '200':
          description: '수정 성공'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './work-time-config-schemas.yaml#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: './work-time-config-schemas.yaml#/components/schemas/WorkTimeConfigResponse'
              examples:
                success:
                  value:
                    code: 0
                    message: 성공
                    data:
                      id: 1
                      storeId: 1
                      workerType: PART_TIME
                      title: "오전 파트 (수정)"
                      workStartTime: "08:30:00"
                      workEndTime: "14:30:00"
                      breakStartTime: null
                      breakEndTime: null

    delete:
      tags:
        - 근무시간 설정
      summary: '근무시간 설정 삭제'
      description: '근무시간 설정을 삭제합니다.'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
          description: 근무시간 설정 ID
          example: 1
      responses:
        '200':
          description: '삭제 성공'
          content:
            application/json:
              schema:
                $ref: './work-time-config-schemas.yaml#/components/schemas/Response'
              examples:
                success:
                  value:
                    code: 0
                    message: 성공
                    data: null
